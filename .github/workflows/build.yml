name: Build Tailscale for FreshTomato (armv5)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Check for upstream updates daily at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build tailscale_combo (armv5/GOARM=5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Set up Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Clone Tailscale source (shallow, specific tag)
        run: |
          git clone --depth 1 --branch v1.102.2 https://github.com/tailscale/tailscale.git tailscale-src

      - name: Add KernelVersion to hostinfo package
        run: |
          cat > tailscale-src/hostinfo/kernel_linux.go << 'EOF'
          // Copyright (c) Tailscale Inc & contributors
          // SPDX-License-Identifier: BSD-3-Clause

          //go:build linux

          package hostinfo

          import (
          	"strconv"
          	"strings"

          	"golang.org/x/sys/unix"
          )

          // KernelVersion returns the major, minor, and patch version of the Linux kernel.
          // It returns (0, 0, 0) if the version cannot be determined.
          func KernelVersion() (major, minor, patch int) {
          	var uname unix.Utsname
          	if err := unix.Uname(&uname); err != nil {
          		return 0, 0, 0
          	}
          	release := unix.ByteSliceToString(uname.Release[:])
          	return parseKernelVersion(release)
          }

          // parseKernelVersion parses a Linux kernel version string like "6.12.73+deb13-amd64"
          // or "5.15.0-76-generic" and returns the major, minor, and patch components.
          // It returns (0, 0, 0) if the version cannot be parsed.
          func parseKernelVersion(release string) (major, minor, patch int) {
          	parts := strings.Split(release, ".")
          	if len(parts) < 3 {
          		return 0, 0, 0
          	}

          	major, err := strconv.Atoi(parts[0])
          	if err != nil {
          		return 0, 0, 0
          	}

          	minor, err = strconv.Atoi(parts[1])
          	if err != nil {
          		return 0, 0, 0
          	}

          	// Patch version may have additional info after a hyphen or plus (e.g., "0-76-generic" or "41+deb13-amd64")
          	// Extract just the numeric part before any hyphen or plus
          	patchStr := parts[2]
          	if idx := strings.IndexAny(patchStr, "-+"); idx != -1 {
          		patchStr = patchStr[:idx]
          	}

          	patch, err = strconv.Atoi(patchStr)
          	if err != nil {
          		return 0, 0, 0
          	}

          	return major, minor, patch
          }
          EOF

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Build armv5 combined binary (ts_include_cli, ts_extra_small)
        env:
          GOARM: 5
          GOARCH: arm
          CGO_ENABLED: 0
          GO111MODULE: on
        run: |
          cd tailscale-src
          # Build from cmd/tailscaled with ts_include_cli to get combined binary
          # that detects argv[0] (tailscale vs tailscaled)
          go build -tags "ts_include_cli,ts_extra_small" -ldflags "-s -w" -o tailscale_combo ./cmd/tailscaled

      - name: Pack with UPX
        run: |
          cd tailscale-src
          upx --best --lzma tailscale_combo

      - name: Verify binary
        run: |
          file tailscale-src/tailscale_combo
          ls -lh tailscale-src/tailscale_combo
          # Test argv[0] detection
          cp tailscale-src/tailscale_combo tailscale-src/tailscale
          cp tailscale-src/tailscale_combo tailscale-src/tailscaled
          ./tailscale-src/tailscale version
          ./tailscale-src/tailscaled --version

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.102.2-freshtomato-${{ github.run_number }}
          name: Tailscale v1.102.2 for FreshTomato (armv5)
          body: |
            **Tailscale v1.102.2 - FreshTomato armv5 build**
            
            Combined `tailscale` + `tailscaled` binary for FreshTomato routers running on legacy Broadcom hardware with Linux kernel 2.6.36.
            
            **Architecture:** ARMv5 (soft-float, GOARM=5)
            
            **Size:** ~8 MB (UPX packed, with ts_extra_small)
            
            **Installation on Router:**
            ```bash
            # Copy to router and run:
            mv tailscale_combo /opt/bin/tailscale_combo
            chmod +x /opt/bin/tailscale_combo
            ln -sf /opt/bin/tailscale_combo /opt/bin/tailscaled
            
            # Start
            modprobe tun
            iptables -I INPUT 1 -i tailscale0 -j ACCEPT
            iptables -I FORWARD -i tailscale0 -j ACCEPT
            iptables -I FORWARD -o tailscale0 -j ACCEPT
            /opt/bin/tailscaled --state=/opt/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscaled.sock &
            /opt/bin/tailscale up --accept-routes --accept-dns=true --hostname=fresh-1
            ```
            
            **Auto-start** (add to both `script_startup` and `script_usbmount` in FreshTomato GUI):
            ```bash
            modprobe tun
            /opt/bin/tailscaled --state=/opt/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscaled.sock &
            sleep 5
            /opt/bin/tailscale up --accept-routes --accept-dns=true --hostname=fresh-1
            iptables -I INPUT 1 -i tailscale0 -j ACCEPT 2>/dev/null
            iptables -I FORWARD -i tailscale0 -j ACCEPT 2>/dev/null
            iptables -I FORWARD -o tailscale0 -j ACCEPT 2>/dev/null
            ```
          files: tailscale-src/tailscale_combo
          draft: false
          prerelease: false

      - name: Upload artifact (for scheduled runs)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule'
        with:
          name: tailscale_combo_armv5
          path: tailscale-src/tailscale_combo
          retention-days: 30